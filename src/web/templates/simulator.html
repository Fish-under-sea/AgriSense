<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSense - 模拟器控制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        header h1 {
            color: #4ecca3;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            color: #888;
        }
        
        .nav-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: #4ecca3;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .nav-link:hover {
            background: #45b08c;
            transform: translateY(-2px);
        }
        
        .mode-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }
        
        .mode-toggle label {
            font-size: 1.1em;
            color: #aaa;
        }
        
        .toggle-switch {
            position: relative;
            width: 80px;
            height: 40px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: 0.4s;
            border-radius: 40px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 32px;
            width: 32px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #4ecca3;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(40px);
        }
        
        .mode-label {
            font-weight: bold;
            color: #4ecca3;
        }
        
        .panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .panel {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .panel h2 {
            color: #4ecca3;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.95em;
        }
        
        .control-group .value-display {
            float: right;
            color: #4ecca3;
            font-weight: bold;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .slider {
            flex: 1;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: #333;
            outline: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4ecca3;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4ecca3;
            cursor: pointer;
            border: none;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .input-group input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 1em;
        }
        
        .input-group button {
            padding: 10px 20px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .input-group button:hover {
            background: #45b08c;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #4ecca3;
            color: #1a1a2e;
        }
        
        .btn-primary:hover {
            background: #45b08c;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #555;
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: #666;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.online {
            background: #4ecca3;
        }
        
        .status-indicator.offline {
            background: #e74c3c;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .data-preview {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .data-preview pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .refresh-info {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .unit {
            color: #888;
            font-size: 0.9em;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌱 AgriSense 模拟器控制</h1>
            <p>手动调节传感器模拟数据</p>
            <a href="/" class="nav-link">返回主界面</a>
        </header>
        
        <!-- 模式切换 -->
        <div class="mode-toggle">
            <label>模拟模式</label>
            <label class="toggle-switch">
                <input type="checkbox" id="simulationToggle" checked>
                <span class="toggle-slider"></span>
            </label>
            <span class="mode-label" id="modeLabel">已启用</span>
        </div>
        
        <!-- 环境传感器控制 -->
        <div class="panels">
            <div class="panel">
                <h2>
                    🌡️ 环境传感器
                    <span class="status-indicator online"></span>在线
                </h2>
                
                <div class="control-group">
                    <label>
                        温度
                        <span class="value-display" id="tempValue">25°C</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="tempSlider" 
                               min="0" max="50" value="25" step="0.5">
                    </div>
                    <div class="input-group">
                        <input type="number" id="tempInput" value="25" step="0.5" min="0" max="50">
                        <button onclick="setTemp()">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        湿度
                        <span class="value-display" id="humidityValue">60%</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="humiditySlider" 
                               min="0" max="100" value="60" step="1">
                    </div>
                    <div class="input-group">
                        <input type="number" id="humidityInput" value="60" step="1" min="0" max="100">
                        <button onclick="setHumidity()">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        光照强度
                        <span class="value-display" id="lightValue">2500 lux</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="lightSlider" 
                               min="0" max="10000" value="2500" step="100">
                    </div>
                    <div class="input-group">
                        <input type="number" id="lightInput" value="2500" step="100" min="0" max="10000">
                        <button onclick="setLight()">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        CO₂浓度
                        <span class="value-display" id="co2Value">600 ppm</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="co2Slider" 
                               min="300" max="2000" value="600" step="10">
                    </div>
                    <div class="input-group">
                        <input type="number" id="co2Input" value="600" step="10" min="300" max="2000">
                        <button onclick="setCo2()">设置</button>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>
                    🌿 土壤传感器
                    <span class="status-indicator online"></span>在线
                </h2>
                
                <div class="control-group">
                    <label>
                        点位 1 湿度
                        <span class="value-display" id="soil0Value">45%</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="soil0Slider" 
                               min="0" max="100" value="45" step="1">
                    </div>
                    <div class="input-group">
                        <input type="number" id="soil0Input" value="45" step="1" min="0" max="100">
                        <button onclick="setSoil(0)">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        点位 2 湿度
                        <span class="value-display" id="soil1Value">50%</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="soil1Slider" 
                               min="0" max="100" value="50" step="1">
                    </div>
                    <div class="input-group">
                        <input type="number" id="soil1Input" value="50" step="1" min="0" max="100">
                        <button onclick="setSoil(1)">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        点位 3 湿度
                        <span class="value-display" id="soil2Value">48%</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="soil2Slider" 
                               min="0" max="100" value="48" step="1">
                    </div>
                    <div class="input-group">
                        <input type="number" id="soil2Input" value="48" step="1" min="0" max="100">
                        <button onclick="setSoil(2)">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        平均湿度
                        <span class="value-display" id="soilAvgValue">47.67%</span>
                    </label>
                </div>
            </div>
        </div>
        
        <!-- 按钮组 -->
        <div class="button-group" style="justify-content: center;">
            <button class="btn btn-primary" onclick="randomizeData()">🎲 随机化数据</button>
            <button class="btn btn-secondary" onclick="resetToDefault()">🔄 恢复默认</button>
            <button class="btn btn-secondary" onclick="refreshData()">🔄 刷新数据</button>
        </div>
        
        <!-- 数据预览 -->
        <div class="panel" style="margin-top: 20px;">
            <h2>📊 实时数据预览</h2>
            <div class="data-preview">
                <pre id="dataPreview">加载中...</pre>
            </div>
        </div>
        
        <div class="refresh-info">
            最后更新：<span id="lastUpdate">--</span> | 
            数据每 <span id="refreshInterval">2</span> 秒自动刷新
        </div>
    </div>
    
    <script>
        let refreshTimer;
        const REFRESH_INTERVAL = 2000;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initSliders();
            loadSimulationConfig();
            startAutoRefresh();
            checkSimulationMode();
        });
        
        // 初始化滑块和输入框联动
        function initSliders() {
            const pairs = [
                ['tempSlider', 'tempInput', 'tempValue'],
                ['humiditySlider', 'humidityInput', 'humidityValue'],
                ['lightSlider', 'lightInput', 'lightValue'],
                ['co2Slider', 'co2Input', 'co2Value'],
                ['soil0Slider', 'soil0Input', 'soil0Value'],
                ['soil1Slider', 'soil1Input', 'soil1Value'],
                ['soil2Slider', 'soil2Input', 'soil2Value']
            ];
            
            pairs.forEach(([sliderId, inputId, valueId]) => {
                const slider = document.getElementById(sliderId);
                const input = document.getElementById(inputId);
                const valueDisplay = document.getElementById(valueId);
                
                slider.addEventListener('input', function() {
                    input.value = this.value;
                    updateValueDisplay(valueId, this.value);
                });
                
                input.addEventListener('input', function() {
                    slider.value = this.value;
                    updateValueDisplay(valueId, this.value);
                });
            });
        }
        
        // 更新值显示
        function updateValueDisplay(elementId, value) {
            const element = document.getElementById(elementId);
            if (element) {
                if (elementId === 'tempValue') {
                    element.textContent = value + '°C';
                } else if (elementId === 'humidityValue') {
                    element.textContent = value + '%';
                } else if (elementId === 'lightValue') {
                    element.textContent = value + ' lux';
                } else if (elementId === 'co2Value') {
                    element.textContent = value + ' ppm';
                } else {
                    element.textContent = value + '%';
                }
            }
        }
        
        // 加载模拟配置
        async function loadSimulationConfig() {
            try {
                const response = await fetch('/api/simulation/config');
                const config = await response.json();
                
                if (config.environment) {
                    setSliderValue('tempSlider', 'tempInput', 'tempValue', config.environment.temperature.value, '°C');
                    setSliderValue('humiditySlider', 'humidityInput', 'humidityValue', config.environment.humidity.value, '%');
                    setSliderValue('lightSlider', 'lightInput', 'lightValue', config.environment.light.value, ' lux');
                    setSliderValue('co2Slider', 'co2Input', 'co2Value', config.environment.co2.value, ' ppm');
                }
                
                if (config.soil) {
                    setSliderValue('soil0Slider', 'soil0Input', 'soil0Value', config.soil.point_0.value, '%');
                    setSliderValue('soil1Slider', 'soil1Input', 'soil1Value', config.soil.point_1.value, '%');
                    setSliderValue('soil2Slider', 'soil2Input', 'soil2Value', config.soil.point_2.value, '%');
                }
                
                updateSoilAverage();
            } catch (error) {
                console.error('加载配置失败:', error);
            }
        }
        
        function setSliderValue(sliderId, inputId, valueId, value, unit) {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);
            const valueDisplay = document.getElementById(valueId);
            
            if (slider) slider.value = value;
            if (input) input.value = value;
            if (valueDisplay) valueDisplay.textContent = value + unit;
        }
        
        // 设置函数
        async function setTemp() {
            await updateConfig('environment', 'temperature', parseFloat(document.getElementById('tempInput').value));
        }
        
        async function setHumidity() {
            await updateConfig('environment', 'humidity', parseFloat(document.getElementById('humidityInput').value));
        }
        
        async function setLight() {
            await updateConfig('environment', 'light', parseFloat(document.getElementById('lightInput').value));
        }
        
        async function setCo2() {
            await updateConfig('environment', 'co2', parseFloat(document.getElementById('co2Input').value));
        }
        
        async function setSoil(point) {
            const input = document.getElementById(`soil${point}Input`);
            await updateConfig('soil', `point_${point}`, parseFloat(input.value));
            updateSoilAverage();
        }
        
        // 更新配置
        async function updateConfig(category, key, value) {
            try {
                await fetch('/api/simulation/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, key, value })
                });
                showNotification('配置已更新');
            } catch (error) {
                console.error('更新配置失败:', error);
                showNotification('更新失败', 'error');
            }
        }
        
        // 更新土壤平均湿度
        function updateSoilAverage() {
            const soil0 = parseFloat(document.getElementById('soil0Input').value) || 0;
            const soil1 = parseFloat(document.getElementById('soil1Input').value) || 0;
            const soil2 = parseFloat(document.getElementById('soil2Input').value) || 0;
            const avg = ((soil0 + soil1 + soil2) / 3).toFixed(2);
            document.getElementById('soilAvgValue').textContent = avg + '%';
        }
        
        // 随机化数据
        async function randomizeData() {
            try {
                const response = await fetch('/api/simulation/randomize', { method: 'POST' });
                const result = await response.json();
                
                if (result.config) {
                    loadSimulationConfig();
                    showNotification('数据已随机化');
                }
            } catch (error) {
                console.error('随机化失败:', error);
            }
        }
        
        // 恢复默认
        async function resetToDefault() {
            const defaults = {
                environment: {
                    temperature: 25,
                    humidity: 60,
                    light: 2500,
                    co2: 600
                },
                soil: {
                    point_0: 45,
                    point_1: 50,
                    point_2: 48
                }
            };
            
            await updateConfig('environment', 'temperature', defaults.environment.temperature);
            await updateConfig('environment', 'humidity', defaults.environment.humidity);
            await updateConfig('environment', 'light', defaults.environment.light);
            await updateConfig('environment', 'co2', defaults.environment.co2);
            await updateConfig('soil', 'point_0', defaults.soil.point_0);
            await updateConfig('soil', 'point_1', defaults.soil.point_1);
            await updateConfig('soil', 'point_2', defaults.soil.point_2);
            
            loadSimulationConfig();
            showNotification('已恢复默认值');
        }
        
        // 刷新数据
        async function refreshData() {
            await loadSimulationConfig();
            await updateDataPreview();
            showNotification('数据已刷新');
        }
        
        // 切换模拟模式
        document.getElementById('simulationToggle').addEventListener('change', async function() {
            const enabled = this.checked;
            const label = document.getElementById('modeLabel');
            
            try {
                const response = await fetch('/api/simulation/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    label.textContent = enabled ? '已启用' : '已禁用';
                    label.style.color = enabled ? '#4ecca3' : '#e74c3c';
                    showNotification(enabled ? '模拟模式已启用' : '模拟模式已禁用');
                }
            } catch (error) {
                console.error('切换模式失败:', error);
                this.checked = !enabled;
            }
        });
        
        // 检查模拟模式状态
        async function checkSimulationMode() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const enabled = data.system.simulation_enabled;
                
                document.getElementById('simulationToggle').checked = enabled;
                document.getElementById('modeLabel').textContent = enabled ? '已启用' : '已禁用';
                document.getElementById('modeLabel').style.color = enabled ? '#4ecca3' : '#e74c3c';
            } catch (error) {
                console.error('检查状态失败:', error);
            }
        }
        
        // 更新数据预览
        async function updateDataPreview() {
            try {
                const response = await fetch('/api/sensors/all');
                const data = await response.json();
                
                const preview = document.getElementById('dataPreview');
                preview.textContent = JSON.stringify(data, null, 2);
                
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('获取数据失败:', error);
            }
        }
        
        // 自动刷新
        function startAutoRefresh() {
            refreshData();
            refreshTimer = setInterval(() => {
                updateDataPreview();
            }, REFRESH_INTERVAL);
        }
        
        // 通知
        function showNotification(message, type = 'success') {
            // 简单的控制台通知
            console.log(`[${type.toUpperCase()}] ${message}`);
            
            // 可以在这里添加更复杂的通知 UI
        }
    </script>
</body>
</html>
