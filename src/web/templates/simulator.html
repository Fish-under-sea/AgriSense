<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSense - 模拟器控制</title>
    <!-- 引入 GSAP 核心动画库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 视频背景全屏层 */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }
        
        /* 半透明遮罩层 */
        .overlay-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
            pointer-events: none;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }
        
        header h1 {
            color: #4ecca3;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            color: #ccc;
        }
        
        .nav-link {
            display: inline-block;
            margin-top: 15px;
            margin-right: 12px;
            padding: 10px 25px;
            background: rgba(78, 204, 163, 0.8);
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .nav-link:hover {
            background: #45b08c;
            transform: translateY(-2px);
        }
        
        .mode-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            backdrop-filter: blur(8px);
        }
        
        .mode-toggle label {
            font-size: 1.1em;
            color: #ddd;
        }
        
        .toggle-switch {
            position: relative;
            width: 80px;
            height: 40px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: 0.4s;
            border-radius: 40px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 32px;
            width: 32px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #4ecca3;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(40px);
        }
        
        .mode-label {
            font-weight: bold;
            color: #4ecca3;
        }
        
        .panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .panel {
            background: rgba(20, 25, 45, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        .panel h2 {
            color: #4ecca3;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 0.95em;
        }
        
        .control-group .value-display {
            float: right;
            color: #4ecca3;
            font-weight: bold;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .slider {
            flex: 1;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: #444;
            outline: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4ecca3;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .input-group input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-size: 1em;
        }
        
        .input-group button {
            padding: 10px 20px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .input-group button:hover {
            background: #45b08c;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #4ecca3;
            color: #1a1a2e;
        }
        
        .btn-primary:hover {
            background: #45b08c;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: rgba(85, 85, 85, 0.8);
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: #666;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.online {
            background: #4ecca3;
        }
        
        .status-indicator.offline {
            background: #e74c3c;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .data-preview {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .data-preview pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #ddd;
        }
        
        .refresh-info {
            text-align: center;
            color: #aaa;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .unit {
            color: #888;
            font-size: 0.9em;
            margin-left: 5px;
        }

        /* ================= 高级自旋包裹光标样式 ================= */
        @media (min-width: 769px) {
            * { cursor: none !important; }
        }
        
        .target-cursor-wrapper {
            position: fixed; top: 0; left: 0; width: 0; height: 0;
            z-index: 99999; pointer-events: none;
        }
        .target-cursor-dot {
            position: absolute; top: -3px; left: -3px; width: 6px; height: 6px;
            background: #4ecca3; border-radius: 50%; box-shadow: 0 0 10px #4ecca3;
        }
        .target-cursor-corner {
            position: absolute; width: 12px; height: 12px;
            border-color: #4ecca3; border-style: solid; border-width: 0;
            filter: drop-shadow(0 0 4px #4ecca3);
        }
        .corner-tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; }
        .corner-tr { top: 0; left: 0; border-top-width: 3px; border-right-width: 3px; }
        .corner-br { top: 0; left: 0; border-bottom-width: 3px; border-right-width: 3px; }
        .corner-bl { top: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; }

        @media (max-width: 768px) {
            .target-cursor-wrapper { display: none !important; }
        }

    </style>
</head>
<body>
    <!-- 视频背景 -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="/static/Mario.mp4" type="video/mp4">
        您的浏览器不支持视频背景。
    </video>
    <!-- 暗色遮罩 -->
    <div class="overlay-mask"></div>
    
    <div class="container">
        <header>
            <h1>🌱 AgriSense 模拟器控制</h1>
            <p>手动调节传感器模拟数据</p>
            <a href="/" class="nav-link cursor-target">← 返回主页</a>
            <a href="/controller" class="nav-link cursor-target">控制器</a>
        </header>
        
        <!-- 模式切换 -->
        <div class="mode-toggle">
            <label>模拟模式</label>
            <label class="toggle-switch">
                <input type="checkbox" id="simulationToggle" checked>
                <span class="toggle-slider cursor-target"></span>
            </label>
            <span class="mode-label" id="modeLabel">已启用</span>
        </div>
        
        <!-- 环境传感器控制 -->
        <div class="panels">
            <div class="panel">
                <h2>
                    🌡️ 环境传感器
                    <span class="status-indicator online"></span>在线
                </h2>
                
                <div class="control-group">
                    <label>
                        温度
                        <span class="value-display" id="tempValue">25°C</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="tempSlider" 
                               min="0" max="50" value="25" step="0.5">
                    </div>
                    <div class="input-group">
                        <input type="number" id="tempInput" value="25" step="0.5" min="0" max="50">
                        <button class="cursor-target" onclick="setTemp()">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        湿度
                        <span class="value-display" id="humidityValue">60%</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="humiditySlider" 
                               min="0" max="100" value="60" step="1">
                    </div>
                    <div class="input-group">
                        <input type="number" id="humidityInput" value="60" step="1" min="0" max="100">
                        <button class="cursor-target" onclick="setHumidity()">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        光照强度
                        <span class="value-display" id="lightValue">2500 lux</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="lightSlider" 
                               min="0" max="10000" value="2500" step="100">
                    </div>
                    <div class="input-group">
                        <input type="number" id="lightInput" value="2500" step="100" min="0" max="10000">
                        <button class="cursor-target" onclick="setLight()">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        CO₂浓度
                        <span class="value-display" id="co2Value">600 ppm</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="co2Slider" 
                               min="300" max="2000" value="600" step="10">
                    </div>
                    <div class="input-group">
                        <input type="number" id="co2Input" value="600" step="10" min="300" max="2000">
                        <button class="cursor-target" onclick="setCo2()">设置</button>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>
                    🌿 土壤传感器
                    <span class="status-indicator online"></span>在线
                </h2>
                
                <div class="control-group">
                    <label>
                        点位 1 湿度
                        <span class="value-display" id="soil0Value">45%</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="soil0Slider" 
                               min="0" max="100" value="45" step="1">
                    </div>
                    <div class="input-group">
                        <input type="number" id="soil0Input" value="45" step="1" min="0" max="100">
                        <button class="cursor-target" onclick="setSoil(0)">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        点位 2 湿度
                        <span class="value-display" id="soil1Value">50%</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="soil1Slider" 
                               min="0" max="100" value="50" step="1">
                    </div>
                    <div class="input-group">
                        <input type="number" id="soil1Input" value="50" step="1" min="0" max="100">
                        <button class="cursor-target" onclick="setSoil(1)">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        点位 3 湿度
                        <span class="value-display" id="soil2Value">48%</span>
                    </label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="soil2Slider" 
                               min="0" max="100" value="48" step="1">
                    </div>
                    <div class="input-group">
                        <input type="number" id="soil2Input" value="48" step="1" min="0" max="100">
                        <button class="cursor-target" onclick="setSoil(2)">设置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>
                        平均湿度
                        <span class="value-display" id="soilAvgValue">47.67%</span>
                    </label>
                </div>
            </div>
        </div>
        
        <!-- 按钮组 -->
        <div class="button-group">
            <button class="btn btn-primary cursor-target" onclick="randomizeData()">🎲 随机化数据</button>
            <button class="btn btn-secondary cursor-target" onclick="resetToDefault()">🔄 恢复默认</button>
            <button class="btn btn-secondary cursor-target" onclick="refreshData()">🔄 刷新数据</button>
        </div>
        
        <!-- 数据预览 -->
        <div class="panel" style="margin-top: 20px;">
            <h2>📊 实时数据预览</h2>
            <div class="data-preview">
                <pre id="dataPreview">加载中...</pre>
            </div>
        </div>
        
        <div class="refresh-info">
            最后更新：<span id="lastUpdate">--</span> | 
            数据每 <span id="refreshInterval">2</span> 秒自动刷新
        </div>
    </div>
    
    <!-- 光标 DOM 结构 -->
    <div class="target-cursor-wrapper">
        <div class="target-cursor-dot"></div>
        <div class="target-cursor-corner corner-tl"></div>
        <div class="target-cursor-corner corner-tr"></div>
        <div class="target-cursor-corner corner-br"></div>
        <div class="target-cursor-corner corner-bl"></div>
    </div>

    <script>
        // TargetCursor 类 (与 mobile.html 相同，省略重复代码以节省篇幅)
        class TargetCursor {
            constructor(options = {}) {
                this.targetSelector = options.targetSelector || '.cursor-target';
                this.spinDuration = options.spinDuration || 2;
                this.hoverDuration = options.hoverDuration || 0.2;
                this.parallaxOn = options.parallaxOn !== undefined ? options.parallaxOn : true;

                this.wrapper = document.querySelector('.target-cursor-wrapper');
                this.dot = document.querySelector('.target-cursor-dot');
                this.corners = Array.from(document.querySelectorAll('.target-cursor-corner'));

                this.spinTl = null;
                this.activeTarget = null;
                this.currentLeaveHandler = null;
                this.resumeTimeout = null;

                this.isActive = false;
                this.targetCornerPositions = null;
                this.activeStrength = { current: 0 }; 
                this.constants = { borderWidth: 3, cornerSize: 12 };

                this.init();
            }

            isMobile() {
                const hasTouchScreen = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                const isSmallScreen = window.innerWidth <= 768;
                return hasTouchScreen && isSmallScreen;
            }

            init() {
                if (this.isMobile() || !this.wrapper) return;

                gsap.set(this.wrapper, { x: window.innerWidth / 2, y: window.innerHeight / 2 });
                this.createSpinTimeline();

                const { cornerSize } = this.constants;
                const restPositions = [
                    { x: -cornerSize * 1.5, y: -cornerSize * 1.5 },
                    { x: cornerSize * 0.5, y: -cornerSize * 1.5 },
                    { x: cornerSize * 0.5, y: cornerSize * 0.5 },
                    { x: -cornerSize * 1.5, y: cornerSize * 0.5 }
                ];
                this.corners.forEach((corner, i) => {
                    gsap.set(corner, { x: restPositions[i].x, y: restPositions[i].y });
                });

                this.tickerFn = this.render.bind(this);

                window.addEventListener('mousemove', e => {
                    gsap.to(this.wrapper, { x: e.clientX, y: e.clientY, duration: 0.1, ease: 'power3.out' });
                });

                window.addEventListener('scroll', () => {
                    if (!this.activeTarget) return;
                    const mouseX = gsap.getProperty(this.wrapper, 'x');
                    const mouseY = gsap.getProperty(this.wrapper, 'y');
                    const elementUnderMouse = document.elementFromPoint(mouseX, mouseY);
                    const isStillOverTarget = elementUnderMouse && (elementUnderMouse === this.activeTarget || elementUnderMouse.closest(this.targetSelector) === this.activeTarget);
                    if (!isStillOverTarget && this.currentLeaveHandler) {
                        this.currentLeaveHandler();
                    }
                }, { passive: true });

                window.addEventListener('mousedown', () => {
                    gsap.to(this.dot, { scale: 0.7, duration: 0.3 });
                    gsap.to(this.wrapper, { scale: 0.9, duration: 0.2 });
                });
                window.addEventListener('mouseup', () => {
                    gsap.to(this.dot, { scale: 1, duration: 0.3 });
                    gsap.to(this.wrapper, { scale: 1, duration: 0.2 });
                });

                window.addEventListener('mouseover', e => this.handleEnter(e), { passive: true });
            }

            createSpinTimeline() {
                if (this.spinTl) this.spinTl.kill();
                this.spinTl = gsap.timeline({ repeat: -1 }).to(this.wrapper, { rotation: '+=360', duration: this.spinDuration, ease: 'none' });
            }

            render() {
                if (!this.targetCornerPositions) return;

                const strength = this.activeStrength.current;
                if (strength === 0) return;

                const cursorX = gsap.getProperty(this.wrapper, 'x');
                const cursorY = gsap.getProperty(this.wrapper, 'y');

                this.corners.forEach((corner, i) => {
                    const currentX = gsap.getProperty(corner, 'x');
                    const currentY = gsap.getProperty(corner, 'y');

                    const targetX = this.targetCornerPositions[i].x - cursorX;
                    const targetY = this.targetCornerPositions[i].y - cursorY;

                    const finalX = currentX + (targetX - currentX) * strength;
                    const finalY = currentY + (targetY - currentY) * strength;

                    const duration = strength >= 0.99 ? (this.parallaxOn ? 0.2 : 0) : 0.05;

                    gsap.to(corner, {
                        x: finalX, y: finalY, duration: duration,
                        ease: duration === 0 ? 'none' : 'power1.out', overwrite: 'auto'
                    });
                });
            }

            handleEnter(e) {
                const target = e.target.closest(this.targetSelector);
                if (!target || target === this.activeTarget) return;

                if (this.activeTarget) this.cleanupTarget();
                if (this.resumeTimeout) clearTimeout(this.resumeTimeout);

                this.activeTarget = target;
                this.corners.forEach(corner => gsap.killTweensOf(corner));

                gsap.killTweensOf(this.wrapper, 'rotation');
                if (this.spinTl) this.spinTl.pause();
                gsap.set(this.wrapper, { rotation: 0 });

                const rect = target.getBoundingClientRect();
                const { borderWidth, cornerSize } = this.constants;
                const cursorX = gsap.getProperty(this.wrapper, 'x');
                const cursorY = gsap.getProperty(this.wrapper, 'y');

                this.targetCornerPositions = [
                    { x: rect.left - borderWidth, y: rect.top - borderWidth },
                    { x: rect.right + borderWidth - cornerSize, y: rect.top - borderWidth },
                    { x: rect.right + borderWidth - cornerSize, y: rect.bottom + borderWidth - cornerSize },
                    { x: rect.left - borderWidth, y: rect.bottom + borderWidth - cornerSize }
                ];

                this.isActive = true;
                gsap.ticker.add(this.tickerFn);

                gsap.to(this.activeStrength, { current: 1, duration: this.hoverDuration, ease: 'power2.out' });

                this.corners.forEach((corner, i) => {
                    gsap.to(corner, {
                        x: this.targetCornerPositions[i].x - cursorX,
                        y: this.targetCornerPositions[i].y - cursorY,
                        duration: 0.2, ease: 'power2.out'
                    });
                });

                this.currentLeaveHandler = () => this.handleLeave();
                target.addEventListener('mouseleave', this.currentLeaveHandler);
            }

            handleLeave() {
                gsap.ticker.remove(this.tickerFn);
                this.isActive = false;
                this.targetCornerPositions = null;
                gsap.set(this.activeStrength, { current: 0, overwrite: true });

                const prevTarget = this.activeTarget;
                this.activeTarget = null;

                gsap.killTweensOf(this.corners);
                const { cornerSize } = this.constants;
                const restPositions = [
                    { x: -cornerSize * 1.5, y: -cornerSize * 1.5 },
                    { x: cornerSize * 0.5, y: -cornerSize * 1.5 },
                    { x: cornerSize * 0.5, y: cornerSize * 0.5 },
                    { x: -cornerSize * 1.5, y: cornerSize * 0.5 }
                ];

                this.corners.forEach((corner, i) => {
                    gsap.to(corner, { x: restPositions[i].x, y: restPositions[i].y, duration: 0.3, ease: 'power3.out' });
                });

                this.resumeTimeout = setTimeout(() => {
                    if (!this.activeTarget && this.spinTl) {
                        const currentRotation = gsap.getProperty(this.wrapper, 'rotation');
                        const normalizedRotation = currentRotation % 360;
                        this.spinTl.kill();
                        this.spinTl = gsap.timeline({ repeat: -1 }).to(this.wrapper, { rotation: '+=360', duration: this.spinDuration, ease: 'none' });
                        gsap.to(this.wrapper, {
                            rotation: normalizedRotation + 360,
                            duration: this.spinDuration * (1 - normalizedRotation / 360),
                            ease: 'none',
                            onComplete: () => this.spinTl.restart()
                        });
                    }
                }, 50);

                this.cleanupTarget(prevTarget);
            }

            cleanupTarget(target = this.activeTarget) {
                if (target && this.currentLeaveHandler) {
                    target.removeEventListener('mouseleave', this.currentLeaveHandler);
                }
                this.currentLeaveHandler = null;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new TargetCursor({
                targetSelector: '.cursor-target', 
                spinDuration: 3, 
                hoverDuration: 0.2 
            });
        });

        let refreshTimer;
        const REFRESH_INTERVAL = 2000;
        
        document.addEventListener('DOMContentLoaded', function() {
            initSliders();
            loadSimulationConfig();
            startAutoRefresh();
            checkSimulationMode();
        });
        
        function initSliders() {
            const pairs = [
                ['tempSlider', 'tempInput', 'tempValue'],
                ['humiditySlider', 'humidityInput', 'humidityValue'],
                ['lightSlider', 'lightInput', 'lightValue'],
                ['co2Slider', 'co2Input', 'co2Value'],
                ['soil0Slider', 'soil0Input', 'soil0Value'],
                ['soil1Slider', 'soil1Input', 'soil1Value'],
                ['soil2Slider', 'soil2Input', 'soil2Value']
            ];
            
            pairs.forEach(([sliderId, inputId, valueId]) => {
                const slider = document.getElementById(sliderId);
                const input = document.getElementById(inputId);
                const valueDisplay = document.getElementById(valueId);
                
                slider.addEventListener('input', function() {
                    input.value = this.value;
                    updateValueDisplay(valueId, this.value);
                });
                
                input.addEventListener('input', function() {
                    slider.value = this.value;
                    updateValueDisplay(valueId, this.value);
                });
            });
        }
        
        function updateValueDisplay(elementId, value) {
            const element = document.getElementById(elementId);
            if (element) {
                if (elementId === 'tempValue') {
                    element.textContent = value + '°C';
                } else if (elementId === 'humidityValue') {
                    element.textContent = value + '%';
                } else if (elementId === 'lightValue') {
                    element.textContent = value + ' lux';
                } else if (elementId === 'co2Value') {
                    element.textContent = value + ' ppm';
                } else {
                    element.textContent = value + '%';
                }
            }
        }
        
        async function loadSimulationConfig() {
            try {
                const response = await fetch('/api/simulation/config');
                const config = await response.json();
                
                if (config.environment) {
                    setSliderValue('tempSlider', 'tempInput', 'tempValue', config.environment.temperature.value, '°C');
                    setSliderValue('humiditySlider', 'humidityInput', 'humidityValue', config.environment.humidity.value, '%');
                    setSliderValue('lightSlider', 'lightInput', 'lightValue', config.environment.light.value, ' lux');
                    setSliderValue('co2Slider', 'co2Input', 'co2Value', config.environment.co2.value, ' ppm');
                }
                
                if (config.soil) {
                    setSliderValue('soil0Slider', 'soil0Input', 'soil0Value', config.soil.point_0.value, '%');
                    setSliderValue('soil1Slider', 'soil1Input', 'soil1Value', config.soil.point_1.value, '%');
                    setSliderValue('soil2Slider', 'soil2Input', 'soil2Value', config.soil.point_2.value, '%');
                }
                
                updateSoilAverage();
            } catch (error) {
                console.error('加载配置失败:', error);
            }
        }
        
        function setSliderValue(sliderId, inputId, valueId, value, unit) {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);
            const valueDisplay = document.getElementById(valueId);
            
            if (slider) slider.value = value;
            if (input) input.value = value;
            if (valueDisplay) valueDisplay.textContent = value + unit;
        }
        
        async function setTemp() {
            await updateConfig('environment', 'temperature', parseFloat(document.getElementById('tempInput').value));
        }
        
        async function setHumidity() {
            await updateConfig('environment', 'humidity', parseFloat(document.getElementById('humidityInput').value));
        }
        
        async function setLight() {
            await updateConfig('environment', 'light', parseFloat(document.getElementById('lightInput').value));
        }
        
        async function setCo2() {
            await updateConfig('environment', 'co2', parseFloat(document.getElementById('co2Input').value));
        }
        
        async function setSoil(point) {
            const input = document.getElementById(`soil${point}Input`);
            await updateConfig('soil', `point_${point}`, parseFloat(input.value));
            updateSoilAverage();
        }
        
        async function updateConfig(category, key, value) {
            try {
                await fetch('/api/simulation/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, key, value })
                });
                showNotification('配置已更新');
            } catch (error) {
                console.error('更新配置失败:', error);
                showNotification('更新失败', 'error');
            }
        }
        
        function updateSoilAverage() {
            const soil0 = parseFloat(document.getElementById('soil0Input').value) || 0;
            const soil1 = parseFloat(document.getElementById('soil1Input').value) || 0;
            const soil2 = parseFloat(document.getElementById('soil2Input').value) || 0;
            const avg = ((soil0 + soil1 + soil2) / 3).toFixed(2);
            document.getElementById('soilAvgValue').textContent = avg + '%';
        }
        
        async function randomizeData() {
            try {
                const response = await fetch('/api/simulation/randomize', { method: 'POST' });
                const result = await response.json();
                
                if (result.config) {
                    loadSimulationConfig();
                    showNotification('数据已随机化');
                }
            } catch (error) {
                console.error('随机化失败:', error);
            }
        }
        
        async function resetToDefault() {
            const defaults = {
                environment: {
                    temperature: 25,
                    humidity: 60,
                    light: 2500,
                    co2: 600
                },
                soil: {
                    point_0: 45,
                    point_1: 50,
                    point_2: 48
                }
            };
            
            await updateConfig('environment', 'temperature', defaults.environment.temperature);
            await updateConfig('environment', 'humidity', defaults.environment.humidity);
            await updateConfig('environment', 'light', defaults.environment.light);
            await updateConfig('environment', 'co2', defaults.environment.co2);
            await updateConfig('soil', 'point_0', defaults.soil.point_0);
            await updateConfig('soil', 'point_1', defaults.soil.point_1);
            await updateConfig('soil', 'point_2', defaults.soil.point_2);
            
            loadSimulationConfig();
            showNotification('已恢复默认值');
        }
        
        async function refreshData() {
            await loadSimulationConfig();
            await updateDataPreview();
            showNotification('数据已刷新');
        }
        
        document.getElementById('simulationToggle').addEventListener('change', async function() {
            const enabled = this.checked;
            const label = document.getElementById('modeLabel');
            
            try {
                const response = await fetch('/api/simulation/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    label.textContent = enabled ? '已启用' : '已禁用';
                    label.style.color = enabled ? '#4ecca3' : '#e74c3c';
                    showNotification(enabled ? '模拟模式已启用' : '模拟模式已禁用');
                }
            } catch (error) {
                console.error('切换模式失败:', error);
                this.checked = !enabled;
            }
        });
        
        async function checkSimulationMode() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const enabled = data.system.simulation_enabled;
                
                document.getElementById('simulationToggle').checked = enabled;
                document.getElementById('modeLabel').textContent = enabled ? '已启用' : '已禁用';
                document.getElementById('modeLabel').style.color = enabled ? '#4ecca3' : '#e74c3c';
            } catch (error) {
                console.error('检查状态失败:', error);
            }
        }
        
        async function updateDataPreview() {
            try {
                const response = await fetch('/api/sensors/all');
                const data = await response.json();
                
                const preview = document.getElementById('dataPreview');
                preview.textContent = JSON.stringify(data, null, 2);
                
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('获取数据失败:', error);
            }
        }
        
        function startAutoRefresh() {
            refreshData();
            refreshTimer = setInterval(() => {
                updateDataPreview();
            }, REFRESH_INTERVAL);
        }
        
        function showNotification(message, type = 'success') {
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
    </script>
